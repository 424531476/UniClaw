[project]
name = "uniclaw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "croniter>=6.0.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "langchain-community>=0.3.0",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.0",
    "langchain>=1.2.15",
    "pillow>=10.0.0",
    "prompt-toolkit>=3.0.0",
    "pyaml>=26.2.1",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.9.0",
    "qrcode>=8.2",
    "silk-python>=0.2.8",
    "cachetools>=7.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "cython>=3.0.0",
    "setuptools>=82.0.1",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
